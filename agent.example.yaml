# 节点 Agent 配置示例（复制为 agent.yaml 并按节点修改）
master:
  # 主控 ws 地址（不含 query；生产用 wss://，由 Caddy 终止 TLS 后转发给主控的 WS 端口）
  # 对外路径：<面板域名>/node/ws（四端口模型，2026-08-24 起；Caddy 按 @ws 规则分流）
  url: ws://127.0.0.1:18082/node/ws
  node_id: node1
  secret: change-me   # 主控「新增服务器」时生成，仅展示一次

xray:
  bin: /usr/local/bin/xray
  config_path: /etc/xray-agent/config.json
  log_path: /var/log/xray-agent/xray.log
  pid_file: /run/xray-agent/xray.pid

# 流量采集：对应 xray 配置的 api 段（agent 通过 gRPC 查询 stats）
# 周期也可由主控「设置 → 节点上报」远程下发（仅当前会话生效，agent.yaml 为兜底）；
# 远程生效采集周期 = min(collect_interval, 生效上报周期)。
stats:
  api_addr: 127.0.0.1:10085
  collect_interval: 30s
  report_interval: 60s

# 自升级下载源（xray-agent upgrade；默认 GitHub acdc-awa/XPanel-Node Releases，均可不填）
update:
  # repo: acdc-awa/XPanel-Node   # owner/repo
  # mirror: ""                    # github.com 替代基址/代理前缀，如 https://ghproxy.net/https://github.com

heartbeat_interval: 30s
reconnect_max: 60s
